# ===================================================================
# PROJECT-DOCS-SITE-DEPLOY.yaml
# pro-judge 문서 사이트(VitePress) GitHub Pages 배포
# ===================================================================
#
# 동작:
# - site/ 를 빌드해 GitHub Pages(https://cassiiopeia.github.io/pro-judge/)에 배포
# - 문서 원본은 site/content/ 이고, 예시 보고서(examples/)·화면(assets/)은 빌드 때 복사된다
#
# 트리거: main 브랜치 push 시 site/**, examples/**, assets/** 변경 (+ 수동 실행)
#
# 사전 설정: Settings → Pages → Source 를 "GitHub Actions" 로 지정
# ===================================================================

name: PROJECT-DOCS-SITE-DEPLOY

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "examples/**"
      - "assets/**"
      - ".github/workflows/PROJECT-DOCS-SITE-DEPLOY.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 배포는 한 번에 하나만. 진행 중인 배포를 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v5

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 사이트 빌드
        run: |
          cd site
          npm ci
          npm run docs:build

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
