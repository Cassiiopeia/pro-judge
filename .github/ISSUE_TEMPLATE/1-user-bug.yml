name: 🐞 버그 신고 (사용자)
description: 설치·채점·보고서가 오류를 내거나 이상하게 동작할 때
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 오류 메시지 한 줄과 무엇을 했는지만 있으면 재현할 수 있다. 대회 자료(점수·전략)는 붙이지 않아도 된다.
  - type: textarea
    id: what
    attributes:
      label: 무엇을 했나
      description: 에이전트에게 한 말이나 실행한 명령
      placeholder: '"이 레포 채점해줘" → aggregate.py 단계에서 멈춤'
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 오류·이상한 결과
      description: "`오류:`로 시작하는 줄이나 traceback 마지막 몇 줄"
      render: text
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 설치 방식
      options: [npx skills, Claude Code 플러그인, 직접 clone]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 에이전트·OS·버전
      placeholder: Claude Code / macOS 15 / v0.3.1
