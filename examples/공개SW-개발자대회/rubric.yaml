contest: 제10회 공개SW 개발자대회
purpose:
  official: null
  contest_types: [open-source]
gate:
  source: none
calibration:
  status: none
evaluator_groups:
  - id: judges
    weight: 95
    source: official
    personas: [industry-dev, academic, community-lead]
  - id: verification
    weight: 5
    source: inferred
    why: "제10회 문서는 기능테스트를 '발표 평가 전 별도 진행'으로만 적고 수행 주체가 없다. 2026 공고의 '전문 검증기관' 표현을 따라 별도 그룹으로 뒀다"
    personas: [verifier]
items:
  # ---- 1차 서면평가 (20점) ----
  - id: code-structure
    name: 코딩의 적절성 및 구조의 합리성
    points: {judges: 5}
    source: official
    official_text: "코딩의 적절성 및 구조의 합리성"
    questions:
      - text: "모듈·파일이 책임 단위로 나뉘어 있고 중복이 없는가"
        source: inferred
        why: "구조의 합리성은 책임 분리와 중복으로 관찰된다"
      - text: "코드 규칙(이름·주석·에러 처리)이 레포 전체에서 일관된가"
        source: inferred
        why: "코딩의 적절성을 관찰 가능한 일관성으로 바꿨다"
    evidence_types: [observation, quote]
    anchors:
      0: "소스코드가 제출되지 않았거나 한 파일에 모든 로직이 몰려 있다"
      5: "모듈이 나뉘어 있으나 같은 코드가 2곳 이상 복사돼 있거나 에러 처리 방식이 파일마다 다르다"
      10: "모듈마다 책임이 한 문장으로 설명되고 복사된 코드가 없으며 에러 처리 방식이 한 가지다"
    caps: []
  - id: code-completeness
    name: 코드의 완성도 및 시연가능성
    points: {judges: 5}
    source: official
    official_text: "코드의 완성도 및 시연가능성"
    questions:
      - text: "README 절차만으로 외부인이 설치·실행할 수 있는가"
        source: inferred
        why: "시연가능성의 1차 근거는 재현 가능한 실행 절차"
      - text: "자동 테스트가 있고 통과하는가"
        source: inferred
        why: "완성도를 숫자로 확인할 수 있는 근거"
    evidence_types: [demo, numbers, observation]
    anchors:
      0: "실행 방법이 없고 실행되는 산출물도 없다"
      5: "실행 방법은 있으나 테스트가 없거나 테스트 결과(통과 수)가 없다"
      10: "README 절차대로 실행되고 테스트 N개 통과가 확인되며 시연 영상이 있다"
    caps:
      - rule: no-run-instructions
        cap: 4
        unlock: "README에 설치·실행 명령이 순서대로 있어야 넘는다"
        source: inferred
        why: "실행 절차가 없으면 심사위원이 시연가능성을 확인할 방법이 없다"
  - id: doc-specificity
    name: 개발 문서의 구체성
    points: {judges: 5}
    source: official
    official_text: "개발 문서의 구체성"
    questions:
      - text: "설계·구조·사용법이 문서로 있는가"
        source: inferred
        why: "프로젝트 Document가 1차 제출물이다"
      - text: "문서에 숫자·명령·파일 경로처럼 따라 할 수 있는 내용이 있는가"
        source: inferred
        why: "구체성은 따라 할 수 있는 내용의 양으로 관찰된다"
    evidence_types: [quote, observation]
    anchors:
      0: "README 외 문서가 없고 README가 한 문단 이하다"
      5: "사용법 문서는 있으나 설계·구조 설명이나 명령 예시가 없다"
      10: "설계 문서·구조도·사용법이 있고 명령 예시와 파일 경로가 문서에 적혀 있다"
    caps: []
  - id: project-level
    name: 프로젝트 수준
    points: {judges: 5}
    source: official
    official_text: "프로젝트 수준"
    questions:
      - text: "기술적 난이도가 있는 부분이 무엇이고 그것이 동작하는가"
        source: inferred
        why: "수준은 어려운 문제를 실제로 풀었는지로 판단된다"
      - text: "규모(코드량·기능 수·커밋 기간)가 숫자로 드러나는가"
        source: inferred
        why: "수준 비교는 숫자로만 가능하다"
    evidence_types: [numbers, observation]
    anchors:
      0: "튜토리얼 예제 수준이며 직접 만든 로직이 없다"
      5: "직접 만든 기능이 2개 이상 있으나 기술적 난점을 문서에서 설명하지 않는다"
      10: "기술적 난점 2개 이상을 문서에서 설명하고 그 부분이 코드와 테스트로 확인된다"
    caps: []
  # ---- 기능테스트 (5점) ----
  - id: function-test
    name: 기능테스트 결과
    points: {verification: 5}
    source: official
    official_text: "기능테스트 결과"
    questions:
      - text: "명시된 기능을 테스트 절차대로 돌렸을 때 통과하는가"
        source: inferred
        why: "기능테스트는 명시 기능 대비 통과 여부"
      - text: "실패·예외 입력에서 오류 메시지가 나오는가"
        source: inferred
        why: "검증기관 테스트는 예외 경로도 본다"
    evidence_types: [demo, numbers]
    anchors:
      0: "실행이 안 되거나 명시 기능 중 절반 이상이 실패한다"
      5: "핵심 기능은 동작하나 예외 입력에서 traceback이 나오거나 실패 기능이 있다"
      10: "명시 기능 전부가 통과하고 예외 입력에 오류 메시지 한 줄로 응답한다"
    caps: []
  # ---- 2차 시연평가 (75점) ----
  - id: presentation
    name: 작품 발표
    points: {judges: 10}
    source: official
    official_text: "작품 발표"
    questions:
      - text: "10분 안에 문제·해결·결과를 숫자와 함께 전달하는가"
        source: inferred
        why: "발표 10분 + Q&A 5분 형식"
      - text: "Q&A에서 근거를 들어 답하는가"
        source: inferred
        why: "15분 PT에 Q&A 5분이 포함된다"
    evidence_types: [demo, numbers, quote]
    anchors:
      0: "발표자료가 없다"
      5: "발표자료는 있으나 문제 규모나 결과에 숫자가 없다"
      10: "발표자료에 문제 규모·결과 숫자가 있고 시연 화면이 포함되어 있다"
    caps:
      - rule: no-deck
        cap: 3
        unlock: "발표자료(PPT/PDF) 또는 발표 영상이 제출돼야 넘는다"
        source: inferred
        why: "발표 항목은 발표자료 없이는 평가 대상이 없다"
  - id: oss-usage
    name: 공개SW 활용성
    points: {judges: 10}
    source: official
    official_text: "공개SW 활용성"
    questions:
      - text: "OSI 승인 라이선스로 공개되어 있는가"
        source: inferred
        why: "공개SW의 전제 조건"
      - text: "다른 사람이 가져다 쓸 수 있는 단위(라이브러리·CLI·플러그인)로 나와 있는가"
        source: inferred
        why: "활용성은 재사용 단위가 있는지로 관찰된다"
      - text: "사용한 오픈소스 의존성과 그 라이선스를 밝히는가"
        source: inferred
        why: "라이선스 검증(분석보고서)이 대회 절차에 있다"
    evidence_types: [proper-nouns, observation, quote]
    anchors:
      0: "라이선스 파일이 없고 재사용 단위도 없다"
      5: "라이선스 파일은 있으나 설치해 쓰는 방법(패키지·플러그인 설치 명령)이 없다"
      10: "OSI 라이선스 파일, 설치 명령, 의존성 라이선스 목록이 모두 레포에 있다"
    caps:
      - rule: no-license
        cap: 4
        unlock: "레포 루트에 OSI 승인 라이선스 파일(LICENSE)이 있어야 넘는다"
        source: inferred
        why: "라이선스 없는 코드는 재사용이 불가능해 오픈소스로 볼 수 없다"
  - id: originality
    name: 독창성
    points: {judges: 15}
    source: official
    official_text: "독창성"
    questions:
      - text: "기존 도구 이름을 들고 무엇이 다른지 밝히는가"
        source: inferred
        why: "독창성은 비교 대상이 있어야 판단된다"
      - text: "그 차이가 코드에 실제로 구현돼 있는가"
        source: inferred
        why: "주장만 있는 차별점은 의도다"
    evidence_types: [proper-nouns, quote, observation]
    anchors:
      0: "비슷한 기존 도구와 기능이 같고 차이를 말하지 않는다"
      5: "차별점을 말하지만 비교한 기존 도구 이름이 없다"
      10: "기존 도구 2개 이상을 이름으로 비교하고 차별 기능이 코드에서 확인된다"
    caps: []
  - id: community-potential
    name: 커뮤니티로 발전가능성
    points: {judges: 20}
    source: official
    official_text: "커뮤니티로 발전가능성"
    questions:
      - text: "외부 기여자가 첫 PR을 보낼 경로(CONTRIBUTING·이슈 템플릿·테스트 방법)가 있는가"
        source: inferred
        why: "커뮤니티의 입구는 기여 경로"
      - text: "이미 외부 사용자·기여자·이슈가 있는가"
        source: inferred
        why: "발전가능성의 가장 직접적인 근거는 현재 참여자 수"
      - text: "대회 뒤 누가 유지보수하는지 밝히는가"
        source: inferred
        why: "유지 주체가 없으면 커뮤니티가 자라지 않는다"
    evidence_types: [numbers, proper-nouns, observation]
    anchors:
      0: "기여 경로 문서가 없고 커밋 작성자가 1명이며 이슈가 없다"
      5: "기여 경로 문서는 있으나 외부 기여자·외부 이슈가 0건이다"
      10: "기여 경로 문서가 있고 외부 기여자 N명·외부 이슈 N건이 숫자로 확인되며 유지 계획에 담당과 기간이 있다"
    caps:
      - rule: no-contribution-path
        cap: 6
        unlock: "CONTRIBUTING 문서나 이슈 템플릿, 빌드·테스트 방법이 있어야 넘는다"
        source: inferred
        why: "외부 기여 경로가 없으면 공개된 코드일 뿐 오픈소스 프로젝트가 아니다"
      - rule: no-license
        cap: 4
        unlock: "레포 루트에 OSI 승인 라이선스 파일(LICENSE)이 있어야 넘는다"
        source: inferred
        why: "라이선스 없이는 외부인이 법적으로 기여·재사용할 수 없다"
      - rule: last-minute-commits
        cap: 6
        unlock: "대회 기간 전체에 걸친 커밋 이력이 있어야 넘는다"
        source: inferred
        why: "일괄 커밋은 공개 개발 과정이 없었다는 신호다"
  - id: demo
    name: 작품 데모
    points: {judges: 20}
    source: official
    official_text: "작품 데모"
    questions:
      - text: "핵심 기능을 실제 입력으로 시연하는가"
        source: inferred
        why: "데모는 실제 동작으로만 확인된다"
      - text: "시연 결과를 심사위원이 재현할 수 있는가"
        source: inferred
        why: "재현 불가한 데모는 녹화본과 같다"
    evidence_types: [demo, observation]
    anchors:
      0: "시연할 수 있는 실행물·영상이 없다"
      5: "실행물은 있으나 시연 영상·시나리오가 없거나 핵심 기능 중 일부만 동작한다"
      10: "핵심 기능 전부를 실제 입력으로 시연하는 영상·시나리오가 있고 같은 절차로 재현된다"
    caps:
      - rule: no-demo-material
        cap: 5
        unlock: "시연 영상(3분) 또는 단계별 시연 시나리오가 제출돼야 넘는다"
        source: inferred
        why: "1차 제출물에 시연 동영상이 필수로 들어 있다"
common_caps: [intent-not-evidence, no-specifics, claim-not-verified, claim-failed, quote-for-seven, length-neutral]
